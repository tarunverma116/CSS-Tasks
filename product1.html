<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product cards</title>
    <style>
        .container{
            display:flex;
            justify-content:space-around;
            padding:30px;
        }
        .card{
            width:200px;
            border:2px solid black;
            border-radius:10px;
            padding:15px;
            text-align:center;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="card">
            <img src="img" alt="">
            <h3>Product 1</h3>
            <p>₹500</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="img1" alt="">
            <h3>Product 2</h3>
            <p>₹700</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="img2" alt="">
            <h3>Product 3</h3>
            <p>₹900</p>
            <button>Buy Now</button>
        </div>
</body>
</html>
