<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            display: block;
            margin: 0 auto;
            width: 25%;
            filter: drop-shadow(5px 0px 5px rgb(255, 111, 0)) ;
        }
        div {
            display: block;
            margin: 0 auto;
            width: 200px;
            height: 200px;
            box-shadow: inset 0px 0px 15px 10px rgb(15, 2, 2);
        }
        p{
            text-align: center;
            line-height: 200px;
            font-size: 50px;
            text-shadow: 3px 3px 0px rgb(72, 0, 255), -1px -1px 0px rgb(255, 0, 0), 1px -1px 0px rgb(255, 0, 0), -1px 1px 0px rgb(255, 0, 0), 1px 1px 0px rgb(255, 0, 0);
        }

        </style>
</head>
<body>
    <img src="/Users/tarunverma/Downloads/images-2-removebg-preview.png" alt="shadow" width="400px" height="400px">
    <p>Box Shadow</p>
    <div><p>Box</p></div>

</body>
</html>
