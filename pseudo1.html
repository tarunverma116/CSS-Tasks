<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input{
            border: 0px 0px 2px 0px;
            margin: 3%;
        }
        input:placeholder-shown{
            font-size: 25px;
        }
        input:focus{
            outline: 0px;
            box-shadow: 3px 5px 5px grey;
        }
        input:required{
            border-color:rgb(0, 234, 255);
        }
        input:optional{
            border-color: green;
        }
        input:disabled{
            border-width:0px;
            background: grey;
            color:white;
        }
        input:enabled{
            font-family: Montana;
        }
        input:in-range{
            font-weight: 900;
        }
        input:out-of-range{
            color: red;
        }
        input:valid{
            color: green;
        }
        input:invalid{
            color: red;
        }

    </style>
</head>
<body>
    <form>
        <label for="first-name">First Name:</label>
        <input id="first-name" type="text" placeholder="first name" required/><br/>

        <label for="middle-name">Middle Name:</label>
        <input id="middle-name" type="text" placeholder="Middlename"/><br/>

        <label for="last-name">Last Name:</label>
        <input id="last-name" type="text" placeholder="Last Name" required/><br/>

        <label for="city">City:</label>
        <input id="city" type="text" value="Mathura" disabled/><br/>

        <label for="age">Age:</label>
        <input type="number" id="age" min="10" max="100" placeholder="Age"><br/>

        <label for="email">Email:</label>
        <input type="email" placeholder="Email"><br/>

        <label for="University">University</label>
        <input type="text" value="GLA" readonly><br/>
    </form>
    
</body>
</html>
