<!DOCTYPE html>
<html>
<head>
    <title>Sticky Cards</title>

    <style>
        .Card {
            height: 500px;
            border: 2px solid black;
            position: sticky;
            top: 0;
            color: white;
            font-size: 30px;
            text-align: center;
            line-height: 500px;
        }

        .card1 {
            background: red;
        }

        .card2 {
            background: blue;
        }

        .card3 {
            background: green;
        }

        .card4 {
            background: orange;
        }
    </style>
</head>

<body>

    <div class="Card card1">Card 1</div>
    <div class="Card card2">Card 2</div>
    <div class="Card card3">Card 3</div>
    <div class="Card card4">Card 4</div>

</body>
</html>
