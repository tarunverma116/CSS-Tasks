<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :where(h1,h2){
            color: red;
        }
        :is(h1,h2){
            color: blue;
        }
    </style>
</head>
<body>
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <p>Para 1</p>
    <p>Para 2</p>
    <p>
        Para 
        <span>3</span>
    </p>
    <p>Para 4</p>
    <p>Para 5</p>
    <p>Para 6</p>
</body>
</html>
