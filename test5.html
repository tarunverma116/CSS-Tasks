<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gradient Box</title>

    <style>
        .box {
            width: 300px;
            height: 20px;
            border-radius: 13px;
            background: lightgray;
        }
    </style>
</head>

<body>

    <div class="box">
        <div class="health" style="
            width: 70%;
            height: 20px;
            border-radius: 13px;
            background-image: linear-gradient(
                35deg,
                rgb(12, 8, 8),
                rgb(246, 244, 244)
            );
        "></div>
    </div>

</body>
</html>
