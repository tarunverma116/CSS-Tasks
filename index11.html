<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            height: 500px;
            width: 500px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            outline: 1px solid black;

        }
        .container > div {
            outline: 1px dashed gray;
            font-size: 30px;
        }
        #box1 {
            background-color: rgb(255, 111, 0);
            grid-column: 1 / 3;
            grid-row: 1 / 3;
        }
        #box6{
            background-color: grey;
            grid-column: 2 / 3;
            grid-row: 2 / 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
        <div id="box6">6</div>
    </div>
</body>
</html>
