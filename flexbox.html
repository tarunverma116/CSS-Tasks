<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 100px 100px 100px;
            grid-template-rows: 100px 100px 100px;
        }
        .container>div{
            outline: 1px solid black;
        }
        #box1{
            background-color:  rgb(213, 25, 12);
            flex: 2 0 150px
        }
        #box2{
            background-color: rgb(47, 0, 255);
            flex: 1 0 150px;
        }
        #box3{
            background-color: rgb(40, 139, 131);
            flex: 1 0 150px;
        }
        #box4{
            background-color: rgb(14, 5, 5);
            flex: 2 0 150px;
        }
        #box5{
            background-color: rgb(0, 255, 55);
            flex: 1 0 150px;
        }
        #box6{
            background-color: rgb(0, 255, 208);
            flex: 1 0 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
        <div id="box6">6</div>

    </div>
</body>
</html>
