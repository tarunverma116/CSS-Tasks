<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Cards</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

.container{
    display:flex;
    justify-content:space-around;
    padding:30px;
}

.card{
    width:200px;
    border:2px solid black;
    border-radius:10px;
    padding:15px;
    text-align:center;
}

.card img{
    width:100%;
    height:150px;
}

button{
    padding:8px 15px;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">
        <img src="img" alt="">
        <h3>Product 1</h3>
        <p>₹500</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <img src="img1" alt="">
        <h3>Product 2</h3>
        <p>₹700</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <img src="img2" alt="">
        <h3>Product 3</h3>
        <p>₹900</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <img src="img3" alt="">
        <h3>Product 4</h3>
        <p>₹1200</p>
        <button>Buy Now</button>
    </div>
    

</div>

</body>
</html>
