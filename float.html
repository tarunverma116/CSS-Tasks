<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            border: 5px solid transparent;
            border-radius: 3px;
            box-shadow: 0px 0px 5px black;
            background : radial-gradient(#B79864,#4C4031) padding-box, linear-gradient(#010714, #131A25) border-box;
        }
        p{
            color: transparent;
            font-size: 50px;
            font-weight: 900;
            background: radial-gradient(red, black);
            background-clip: text;
        }
        body{
            background: linear-gradient(white, black);
            background-repeat: no-repeat;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div></div>
   
</body>
</html>
