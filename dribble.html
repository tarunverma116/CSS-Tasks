<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Serenity</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #06145c;
            font-family: Arial;
            color: white;
        }


        .box {
            width: 90%;
            height: 600px;
            margin: 70px auto;

            background: linear-gradient(135deg, #073ccf, #020936);

            position: relative;
            overflow: hidden;
        }


        nav {
            display: flex;
            justify-content: space-between;
            padding: 30px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 35px;
            font-size: 14px;
        }


        .content {
            margin-left: 12%;
            margin-top: 120px;
            position: relative;
            z-index: 2;
        }

        .small {
            letter-spacing: 5px;
            font-size: 12px;
            line-height: 2;
        }

        h1 {
            font-size: 65px;
            margin-top: 25px;
        }

        .button {
            margin-top: 35px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .circle-button {
            width: 40px;
            height: 40px;
            background: blue;
            border-radius: 50%;
            text-align: center;
            padding-top: 11px;
        }



        .big-circle {
            width: 600px;
            height: 600px;

            border-radius: 50%;

            background: #06146e;

            position: absolute;
            right: -100px;
            top: 80px;
        }

        .middle-circle {
            width: 400px;
            height: 400px;

            border-radius: 50%;

            background: #0a31a8;

            position: absolute;
            right: 0;
            top: 180px;
        }

        .small-circle {
            width: 220px;
            height: 220px;

            border-radius: 50%;

            background: #020936;

            position: absolute;
            right: 90px;
            top: 270px;
        }


        .dots {
            position: absolute;
            right: 30px;
            top: 50%;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            border: 1px solid blue;
            margin: 10px;
        }

        .active {
            background: white;
        }

    </style>
</head>

<body>

    <div class="box">


        <nav>

            <div class="logo">
                W2
            </div>

            <div>
                <a href="#">Products</a>
                <a href="#">Goals</a>
                <a href="#">Passions</a>
                <a href="#">⌕</a>
            </div>

        </nav>

        <div class="content">

            <div class="small">
                LEVERAGE AGILE <br>
                FRAMEWORKS
            </div>

            <h1>
                Serenity
            </h1>

            <div class="button">

                <span>Learn more</span>
                </div>

            </div>

        </div>


        <div class="big-circle"></div>

        <div class="middle-circle"></div>

        <div class="small-circle"></div>



        <div class="dots">

            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>

        </div>

    </div>

</body>

</html>
