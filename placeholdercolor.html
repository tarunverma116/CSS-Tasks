<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div::before{
            content: "😌";
            color: black;
            width: 5px;
            height: 5px;
            background-color: balck;
        }
        div::after{
            content: "b";
            color: black;
        }
        input::placeholder{
            color:blue;
        }
        p::selection{
            background-color: rgb(0, 255, 213);
            color: rgb(225, 19, 12);
        }
    </style>
</head>
<body>
    <div>Div</div>
    <input type="text" placeholder="Text">
