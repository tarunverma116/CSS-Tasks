<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --primary-color: black;
            --secondary-color: white;
            --text-size: 5px;
            --mul:5;
        }
        div{
            --primary-color: purple;

        }
        p{

            background-color: var(--primary-color);
            color: var(--secondary-color);
            font-size: calc(var(--mul)*var(--text-size));
        }
    </style>
</head>
<body>
    <p>Hello World!!</p>
    <p>Hello World!!</p>
    <div>
    <p>Hello World!!</p>
    <p>Hello World!!</p>
    <p>Hello World!!</p>
    <p>Hello World!!</p>
    <p>Hello World!!</p>
    </div>
    <p>Hello World!!</p>
    <p>Hello World!!</p>

</body>
</html>
