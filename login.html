<!DOCTYPE html>
<html>
<head>
    <title>Login Card</title>

    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: rgb(62, 106, 227);
        }

        .card{
            width: 300px;
            padding: 20px;
            border: 2px solid black;
            border-radius: 10px;
            background-color: white;
            text-align: center;
        }

        input{
            width: 90%;
            padding: 8px;
            margin: 8px 0;
        }

        button{
            width: 95%;
            padding: 8px;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Login</h2>

    <input type="text" placeholder="Username"><br>

    <input type="password" placeholder="Password"><br>

    <button>Login</button>
</div>

</body>
</html>
