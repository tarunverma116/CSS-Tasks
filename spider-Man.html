<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THOR - GOD OF THUNDER</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            background-image: linear-gradient(to bottom,rgb(0, 0, 0), #001f5c, rgb(105, 255, 250));

            background-size: cover;
            background-position: center;
        }

        h1{
            color: white;
            font-size: 90px;
            text-shadow: 0 0 15px blue;
        }

        h2{
            color: lightblue;
            font-size: 40px;
            margin-top: 10px;
        }

        .card-container{
            padding: 40px 20px;
            background-color: black;
        }

        .card{
            height: 500px;
            margin-bottom: 40px;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            text-align: center;

            background-size: cover;
            background-position: center;

            border: 2px solid white;
            border-radius: 15px;

            position: sticky;
            top: 20px;
        }

        .card h1{
            color: white;
            font-size: 55px;
            text-shadow: 0 0 10px blue;
        }

        .card p{
            color: white;
            font-size: 22px;
            width: 70%;
            margin-top: 15px;
            text-shadow: 2px 2px 5px black;
        }

        .card1{
            background-image: url("https://i.pinimg.com/736x/9a/f5/a5/9af5a5ed663bfd920bf36099316d7cc3.jpg");
        }

        .card2{
            background-image: url("https://images.hdqwalls.com/download/thor-ragnarok-movie-2018-8o-3840x2160.jpg");
        }

        .card3{
            background-image: url("https://townsquare.media/site/442/files/2018/03/thor.jpg");
        }

        .card4{
            background-image: url("https://images.hdqwalls.com/download/thor-ragnarok-movie-2018-8o-3840x2160.jpg");
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>THOR</h1>

        <h2>THE GOD OF THUNDER ⚡️</h2>

    </div>

    <div class="card-container">

        <div class="card card1">

            <h1>MJOLNIR ⚡</h1>

            <p>
                Thor's mighty hammer.
                Only the worthy can lift it.
            </p>

        </div>

        <div class="card card2">

            <h1>GOD OF THUNDER ⚡</h1>

            <p>
                Thor controls lightning and thunder
                with the power of Mjolnir.
            </p>

        </div>

        <div class="card card3">

            <h1>ASGARD</h1>

            <p>
                The home of Thor and the
                gods of Asgard.
            </p>

        </div>

        <div class="card card4">

            <h1>THE AVENGER</h1>

            <p>
                Thor fights with the Avengers
                to protect Earth.
            </p>

        </div>

    </div>

</body>

</html>
